subsystem=APS
component=ICS.STIM.InsertionStage
subscribe {
    description="""HCD CurrentState subscriptions."""


    currentStates = [
        {
            name = "CurrentState"
            subsystem = APS
            component = ICS.HCD.GalilMotion
            usage = "Monitor overall HCD lifecycle state (Uninitialized/Ready/Faulted) and global controller error messages; mapped to the assembly status event hcdState field."
        }
        {
            name = "CurrentStateAxisA"
            subsystem = APS
            component = ICS.HCD.GalilMotion
            usage = """Monitor the InsertionStage motor axis: position (encoder counts), velocity, axisState, inPosition, homed, and error details. The assembly converts position/velocity from counts to millimeters and maps these to its axisStatus event. CurrentStateAxisA-H are identical in structure; axis A is the working default for this single linear axis. The definitive HCD channel assignment is part of the assembly configuration and will be fixed during the PR phase; the subscribed axis here must agree with that configuration."""
        }
        {
            name = "CommandStateAxisA"
            subsystem = APS
            component = ICS.HCD.GalilMotion
            usage = """Monitor long-running command execution on the InsertionStage motor axis: activeThread, moving, inPosition, and per-command error message. CommandStateAxisA-H are identical in structure; axis A is the working default and must agree with the assembly configuration once the HCD channel assignment is fixed during the PR phase."""
        }
    ]
}