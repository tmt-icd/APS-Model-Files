subsystem=APS
component=ICS.ICS.Sequencer
publish {
	description = "Event publishing from the ICS Sequencer"

	events = [
    
        {
			name=apsInstrumentOperatingMode
			description="""APS Instrument Operating Mode event"""
			maxRate = 1
			archive=true
            category=STATUS
			attributes=[
				{
					name=operatingMode
					description="""The APS Instrument Operating Mode"""
					enum=[ON_SKY_MODE, CALIBRATION_SOURCE_MODE, STIMULUS_SOURCE_MODE, SAFE_MODE]
				}
			]
        }
        {
			name=homeMetrics
			description="""Homing sequence metrics"""
			maxRate = 1
            category=ARCHIVE
			archive=true
			attributes=[
				{
					name=homeAllMechanismsStartTime
					description="""Home all mechanisms sequence start time"""
					type=taiDate
				}
				{
					name=homeAllMechanismsCompletedTime
					description="""Home all mechanisms sequence completion time"""
					type=taiDate
				}
			]
		}
        {
			name=standbyMetrics
			description="""Standby sequence metrics"""
			maxRate = 1
            category=ARCHIVE
			archive=true
			attributes=[
				{
					name=standbyPositionAllMechanismsStartTime
					description="""Move all mechanisms to standby positions sequence start time"""
					type=taiDate
				}
				{
					name=standbyPosistionAllMechanismsCompletedTime
					description="""Move all mechanisms to standby positions sequence completion time"""
					type=taiDate
				}
			]
		}
        {
			name=selfTestMetrics
			description="""Self test sequence metrics"""
			maxRate = 1
            category=ARCHIVE
			archive=true
			attributes=[
				{
					name=selfTestProcedureStartTime
					description="""Self test procedure sequence start time"""
					type=taiDate
				}
				{
					name=selfTestProcedureCompletedTime
					description="""Self test procedure sequence completion time"""
					type=taiDate
				}
			]
		}
        {
			name=apsCommandFailureEvent
			archive=true
			description="""Event used to communicate a command failure to the user interface and/or Alignment Procedure Sequencer."""
			maxRate = 1
            category=EVENT
			archive=true
			attributes=[
				{
					name=sourceAssembly
					description="""The user readable name of the source assembly or service that published the event"""
					type=string
                }
				{
					name=message
					description="""Failure message supplied by the event source."""
					type=string
                }				
                {
					name=recoveryState
					description="""For failures and errors that have recovery modes (e.g. motion assemblies and detector assemblies) a state for the progress of the recovery is given: started, completed, aborted.  For failures that do not support auto recovery, the state is NOT USED."""
					enum=["STARTED", "COMPLETED", "ABORTED", "NOT_USED"]
                }
				{
					name=recoveryRetryIndex
					description="""The current auto-recovery retry number."""
					type=integer
                    units=NoUnits
                }
				{
					name=recoveryRetryCount
					description="""The total number of auto-recovery retries before recovery is abandoned."""
					type=integer
                    units=NoUnits
                }
                {
					name=recoveryRetryState
					description="""Indicates if the current retry succeeded or failed."""
					enum=["FAILURE", "SUCCESS"]
                }
			]
		}

    ]
}
