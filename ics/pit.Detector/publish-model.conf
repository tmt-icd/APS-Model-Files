            operatorResponse = "TBD..."
            autoAck = false
            latched = false
        }
        {
            name = assemblyFaulted
            description = """Assembly is in the faulted state."""
            // TODO FIXME: The fields below were automatically added and should be updated manually
            severityLevels = [Major]
            location = "TBD..."
            alarmType = Calculated
            probableCause = "TBD..."
            operatorResponse = "TBD..."
            autoAck = false
            latched = false
        }
        {
            name            = "temperatureWarning"
            description     = "Detector temperature warning limit exceeded."
            severityLevels  = [Warning]
            location        = "PIT Detector"
            alarmType       = Instrument
            probableCause   = "Coolant insufficient."
