{
  subsystem = "APS"
  component = "ICS.HCD.GalilMotion"

  publish {
    currentStates = [
      // Overall HCD status
      {
        name = CurrentState
        description = "Overall HCD status including lifecycle state and global error messages."
        attributes = [
          {
            name = state
            description = "HCD lifecycle state: Uninitialized, Ready, or Faulted."
            enum = ["Uninitialized", "Ready", "Faulted"]
          },
          {
            name = "controllerId"
            type = integer
            description = "Numerical ID identifying which APS Galil controller this HCD is managing (1–4)."
          },
          {
            name = controllerErrorMsg
            description = "Global error message, if any."
            type = string
          }
        ]
      },

      // CurrentState for each axis (A through H) — includes homed (added so assemblies
      // can publish their `indexed` field directly from HCD truth rather than inferring it)
      {
        name = CurrentStateAxisA
        description = "Status update for axis A including position, velocity, operational state, and error details."
        attributes = [
          {
            name = position
            description = "Current position of axis A (in encoder counts)."
            type = float
            units = "encoder"
          },
          {
            name = angularPosition
            description = "Current angular position of axis A (in degrees)."
            type = float
            units = "degree"
          },
          {
            name = countsPerRev
            description = "counts in one 360 degree revolution"
            type = float
          },
          {
            name = wheelPosition
            description = "Achieved wheel slot number (1-based), set by the controller's wheel-select logic on reaching a confirmed valid position (e.g. detent inserted for pupil-mask wheels); -1 = unknown (no successful select since startup/home, or not a wheel axis)."
            type = integer
          },
          {
            name = velocity
            description = "Current velocity of axis A (counts/sec)."
            type = float
          },
          {
            name = axisState
            description = "Operational state of axis A: lost, homing, idle, moving, tracking, or error."
            enum = ["lost", "homing", "idle", "moving", "tracking", "error"]
          },
          {
            name = inPosition
            description = "True if axis A has reached its target."
            type = boolean
          },
          {
            name = homed
            description = "True if axis A has a valid home reference (last homeAxis succeeded; cleared at home start and on home failure)."
            type = boolean
          },
          {
            name = axisErrorMsg
            description = "Error message for axis A, if any."
            type = string
          }
        ]
      },
