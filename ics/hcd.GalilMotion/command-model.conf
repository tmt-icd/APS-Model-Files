{
  subsystem = "APS"
  component = "ICS.HCD.GalilMotion"
  description = """
    Commands which can be accepted by the APS Instrument Control System GalilMotion HCD.
  """
  receive = [
    // Immediate Commands
    {
      name = configAxis
      description = "Configures motion parameters and inPosition threshold for a given axis."
      args = [
        {
          name = axis
          description = "The axis to configure (A-H)."
          enum = ["A", "B", "C", "D", "E", "F", "G", "H"]
        },
        {
          name = velocity
          description = "Default velocity for the axis."
          type = float
        },
        {
          name = acceleration
          description = "Acceleration value for the axis."
          type = float
        },
        {
          name = deceleration
          description = "Deceleration value for the axis."
          type = float
        },
        {
          name = indexOffset
          description = "Index offset for homing."
          type = float
        },
        {
          name = indexSpeed
          description = "Index speed during homing."
          type = float
        },
        {
          name = inPositionThreshold
          description = "Threshold value to determine inPosition status."
          type = float
        }
      ]
      requiredArgs = ["axis"]
    },
    {
      name = configRotatingAxis
      description = "Sets the axis as rotating and selects the approach algorithm."
      args = [
        {
          name = axis
          description = "The axis to configure as rotating (A-H)."
          enum = ["A", "B", "C", "D", "E", "F", "G", "H"]
        },
        {
          name = algorithm
          description = "Approach algorithm for the rotating mechanism."
          enum = ["forward", "reverse", "shortest"]
        }
      ]
      requiredArgs = ["axis", "algorithm"]
    },
    {
      name = configLinearAxis
      description = "Configures the axis as linear with defined soft-limit boundaries."
      args = [
        {
          name = axis
          description = "The axis to configure as linear (A-H)."
          enum = ["A", "B", "C", "D", "E", "F", "G", "H"]
        },
        {
          name = upperLimit
          description = "The upper soft limit for the axis."
          type = float
        },
        {
          name = lowerLimit
          description = "The lower soft limit for the axis."
          type = float
        }
      ]
      requiredArgs = ["axis", "upperLimit", "lowerLimit"]
    },
    {
      name = setBit
      description = "Sets or clears a digital output bit at the specified address."
      args = [
        {
          name = address
          description = "The address of the digital output bit."
          type = integer
        },
        {
          name = value
          description = "The value to set (0 or 1)."
          type = integer
        }
      ]
      requiredArgs = ["address", "value"]
    },
    {
      name = setAO
      description = "Sets an analog output channel to the given value."
      args = [
        {
          name = address
          description = "The address of the analog output channel."
          type = integer
        },
        {
          name = value
          description = "The value to set on the analog output channel."
          type = float
        }
      ]
      requiredArgs = ["address", "value"]
    },

    // Long Running Commands
    {
      name = homeAxis
      description = "Initiates the homing sequence for the specified axis."
      args = [
        {
          name = axis
          description = "The axis to home (A-H)."
          enum = ["A", "B", "C", "D", "E", "F", "G", "H"]
        }
      ]
      requiredArgs = ["axis"]
      completionType = "longRunning"
    },
    {
      name = positionAxis
      description = "Moves the specified axis to an absolute target position."
      args = [
        {
          name = axis
          description = "The axis to move (A-H)."
          enum = ["A", "B", "C", "D", "E", "F", "G", "H"]
        },
        {
          name = target
          description = "The target position (in encoder counts)."
          type = float
        }
      ]
      requiredArgs = ["axis", "target"]
      completionType = "longRunning"
    },
    {
      name = offsetAxis
      description = "Moves the specified axis by a relative distance."
      args = [
        {
          name = axis
          description = "The axis to offset (A-H)."
          enum = ["A", "B", "C", "D", "E", "F", "G", "H"]
        },
        {
          name = distance
          description = "The relative distance to move the axis."
          type = float
        }
      ]
      requiredArgs = ["axis", "distance"]
      completionType = "longRunning"
    },
    {
      name = selectWheel
      description = "Positions a rotating mechanism (e.g., filter wheel) based on a discrete selection."
      args = [
        {
          name = axis
          description = "The axis associated with the rotating mechanism."
          enum = ["A", "B", "C", "D", "E", "F", "G", "H"]
        },
        {
          name = position
          description = "The filter number corresponding to the desired wheel position."
          type = integer
        }
      ]
      requiredArgs = ["axis", "position"]
      completionType = "longRunning"
    },
    {
      name = positionWheel
      description = "Positions a rotating mechanism (e.g., filter wheel) to an angular position."
      args = [
        {
          name = axis
          description = "The axis associated with the rotating mechanism."
          enum = ["A", "B", "C", "D", "E", "F", "G", "H"]
        },
        {
          name = position
          description = "The desired wheel angular position."
          type = float
        }
      ]
      requiredArgs = ["axis", "position"]
      completionType = "longRunning"
    },
    {
      name = trackAxis
      description = """
        Sets the specified axis into tracking mode by streaming a Position-Velocity-Time
        (PVT) segment to the controller. Each invocation supplies one absolute target
        state — position, rate, and the TAI time at which that state should hold — and
        completes when the segment is accepted into the controller's PVT FIFO. The first
        invocation on an Idle axis starts tracking; subsequent invocations append further
        segments. The axis remains in Tracking state until stopAxis is issued or a fault
        occurs. The Assembly is responsible for supplying segments at a cadence and lead
        time sufficient to keep the FIFO non-empty; the HCD detects underrun and
        transitions the axis to Error.
      """
      args = [
        {
          name = axis
          description = "The axis to track (A-H)."
          enum = ["A", "B", "C", "D", "E", "F", "G", "H"]
        },
        {
          name = position
          description = """
            Absolute target position at validTime. Units match positionAxis for the
            axis type: degrees for rotating axes, encoder counts for linear axes.
          """
          type = float
        },
        {
          name = rate
          description = """
            Target velocity at validTime (segment-end velocity). Units match the axis
            type: deg/sec for rotating, counts/sec for linear. Use 0 to bring the axis
            to rest at the target before any subsequent stopAxis.
          """
          type = float
        },
        {
          name = validTime
          description = """
            Absolute TAI time at which the (position, rate) state should be achieved.
            Must be strictly monotonically increasing across successive trackAxis calls
            on the same tracking session. Should be far enough in the future at
            submission time to maintain a non-empty PVT FIFO under the Assembly's
            chosen cadence (typically ~1.2 s lead for 1 Hz updates).
          """
          type = taiTime
        }
      ]
      requiredArgs = ["axis", "position", "rate", "validTime"]
      completionType = "immediate"
    },
    {
      name = stopAxis
      description = "Stops any active motion on the specified axis."
      args = [
        {
          name = axis
          description = "The axis to stop (A-H)."
          enum = ["A", "B", "C", "D", "E", "F", "G", "H"]
        }
      ]
      requiredArgs = ["axis"]
      completionType = "longRunning"
    },
    {
      name = faultReset
      description = """
Initiates fault recovery using the specified severity level.<br>
None: Just clear error messages<br>
Init:  Initialize Controller (reload embedded programs, reconnect to hardware)<br>
Reset: Perform a Reset of the controller (and recover).<br>
Reload: Upload fresh embedded code from repository, burn to EEPROM, and initialize.
"""
      args = [
        {
          name = severity
          description = "Fault recovery level to perform."
          enum = ["None", "Init", "Reset", "Reload"]
        }
      ]
      requiredArgs = ["severity"]
      completionType = "longRunning"
    }
  ]
}