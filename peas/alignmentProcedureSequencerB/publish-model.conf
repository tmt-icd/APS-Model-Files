subsystem=APS
component=PEAS.AlignmentProcedureSequencerB
publish {
	description = """
Sequencer B published events: pupil and image errors for each PSH image for which pupil registration can be calculated, and PEAS notification events
"""

	events=[
		
        {
			name=pshPupilAndImageErrors
			archive=true
			description="""Pupil registration errors and image translation errors calcualted from PSH exposure."""
			maxRate = 1
            category=STATUS
			archive=true
			attributes=[
				{
					name=pupilXRegistrationError
					description="""Calculated Pupil X Registration Error at M1"""
					type=double
                    units=meter
				}
				{
					name=pupilYRegistrationError
					description="""Calculated Pupil Y Registration Error at M1"""
					type=double
                    units=millimeter
				}
				{
					name=pupilRotationError
					description="""Calculated Pupil Rotation Error"""
					type=double
                    units=millimeter
				}
				{
					name=pupilScaleError
					description="""Calculated Pupil Rotation Error"""
					type=double
                    units=percent
				}
                {
 					name=imageXTranslationError
					description="""Calculated Image X Translation Error"""
					type=integer
                    units=pix
               
                }
			]
		}
        {
 			name=apsImageDisplayEvent
			archive=true
			description="""Event used to communicate to the PEAS UI for an image display to be rendered."""
			maxRate = 1
            category=EVENT
			archive=true
			attributes=[
				{
					name=type
					description="""The type of UI Notification"""
					enum = [IMAGE, IMAGE_OVERLAY]
				}
				{
					name=dialogKey
					description="""Used to identify the kind of display and user responses allowed"""
					type=string
				}
				{
					name=helpKey
					description="""Used to retrieve help instructions to be displayed when the user clicks on help within the rendered dialog."""  
					type=string
				}
                {
					name=imageFilename
					description="""String identifying filename to be displayed"""
					type=string
                }
                {
					name=imageOverlayData
					description="""Exposure Id used to call Procedure Data Service API endpoint to retrieve centroids"""
					type=string
                }

			]
		}       
        {
			name=apsCommandFailureEvent
			archive=true
			description="""Event used to communicate a command failure to the user interface and/or Alignment Procedure Sequencer."""
			maxRate = 1
            category=EVENT
			archive=true
			attributes=[
				{
					name=sourceAssembly
					description="""The user readable name of the source assembly or service that published the event"""
					type=string
                }
				{
					name=message
					description="""Failure message supplied by the event source."""
					type=string
                }				
                {
					name=recoveryState
					description="""For failures and errors that have recovery modes (e.g. motion assemblies and detector assemblies) a state for the progress of the recovery is given: started, completed, aborted.  For failures that do not support auto recovery, the state is NOT USED."""
					enum=["STARTED", "COMPLETED", "ABORTED", "NOT_USED"]
                }
				{
					name=recoveryRetryIndex
					description="""The current auto-recovery retry number."""
					type=integer
                    units=NoUnits
                }
				{
					name=recoveryRetryCount
					description="""The total number of auto-recovery retries before recovery is abandoned."""
					type=integer
                    units=NoUnits
                }
                {
					name=recoveryRetryState
					description="""Indicates if the current retry succeeded or failed."""
					enum=["FAILURE", "SUCCESS"]
                }
			]
		}
        {
			name=apsProcedureEvent
			archive=true
			description="""Event used to display expected information generated in real-time by a running procedure."""
			maxRate = 1
            category=EVENT
			archive=true
			attributes=[
				{
					name=type
					description="""The type of UI Notification"""
					enum = [INFO_MESSAGE, WARN_MESSAGE, USER_PROMPT, VIZ_DISPLAY]
				}
				{
					name=dialogKey
					description="""Used to identify the display UI component and user responses supported."""
					type=string
				}
				{
					name=helpKey
					description="""Used to retrieve help instructions to be displayed when the user clicks on help within the rendered dialog."""
					type=string
				}
				{
					name=messageId
					description="""Key used within the PEAS UI resource properties configuration file that holds all messages, including information about where to extract and format procedure data values for inclusion in the message"""
					type=string
                }
			]
		}

	]
}
